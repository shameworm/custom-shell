name: Release

# Push a tag like v1.0.0 (or create a release with a new tag on GitHub) to
# build standalone binaries and publish them as a GitHub release. It can
# also be run by hand for an existing tag, e.g. to rebuild its binaries.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish binaries for"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      # One platform failing shouldn't cancel the others.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-latest, target: linux-arm64 }
          # Bun signs the macOS binaries it compiles (Apple Silicon won't
          # run unsigned code), so no codesign step is needed; re-signing
          # actually fails, because Bun appends the program after signing.
          - { os: macos-latest, target: darwin-arm64 }
          - { os: macos-latest, target: darwin-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Compile
        run: |
          mkdir -p dist
          bun build --compile --minify --target=bun-${{ matrix.target }} \
            app/main.ts --outfile dist/custom-shell
      - name: Package
        run: |
          name=custom-shell-$TAG-${{ matrix.target }}
          tar -czf "$name.tar.gz" -C dist custom-shell
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: cd assets && sha256sum *.tar.gz > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # The release may already exist if it was created on GitHub's
          # "New release" page (which also creates the tag); then just add
          # the binaries to it. Otherwise create it with generated notes.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" assets/* --repo "$REPO" \
              --title "custom-shell $TAG" --generate-notes
          fi
