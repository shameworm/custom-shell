name: Release

# Push a tag like v1.0.0 to build standalone binaries and publish them as a
# GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-latest, target: linux-arm64 }
          # macOS binaries are built on macOS so they can be signed: Apple
          # Silicon won't run an unsigned binary, and an ad-hoc signature
          # is enough for that.
          - { os: macos-latest, target: darwin-arm64 }
          - { os: macos-latest, target: darwin-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Compile
        run: |
          mkdir -p dist
          bun build --compile --minify --target=bun-${{ matrix.target }} \
            app/main.ts --outfile dist/custom-shell
      - name: Sign (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --sign - dist/custom-shell
      - name: Package
        run: |
          name=custom-shell-${{ github.ref_name }}-${{ matrix.target }}
          tar -czf "$name.tar.gz" -C dist custom-shell
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: cd assets && sha256sum *.tar.gz > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" assets/* \
            --repo "${{ github.repository }}" \
            --title "custom-shell ${{ github.ref_name }}" \
            --generate-notes
