name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets CI be started by hand from the Actions tab.
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  install-script:
    # Runs install.sh for this commit on a machine without Bun, so it also
    # installs Bun, then builds the shell and starts the installed binary.
    name: Install script (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck install.sh
      - name: Install
        env:
          INSTALL_DIR: ${{ runner.temp }}/bin
          REF: ${{ github.sha }}
        run: sh install.sh
      - name: Run the installed shell
        run: |
          out="$(printf 'echo installed && type cd\n' | "$RUNNER_TEMP/bin/custom-shell")"
          echo "$out"
          echo "$out" | grep -q "installed"
          echo "$out" | grep -q "cd is a shell builtin"
